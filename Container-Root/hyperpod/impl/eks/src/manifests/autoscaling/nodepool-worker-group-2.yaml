apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nodepool-worker-group-2
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.sagemaker.amazonaws.com
        kind: HyperpodNodeClass
        name: nodeclass-worker-group-2
      expireAfter: Never
      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: Exists
  # The most CPUs Karpenter may add in total to this pool. Adjust to your needs.
  limits:
    cpu: "16"
